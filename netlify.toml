# Netlify configuration.
#
# THERE IS DELIBERATELY NO BUILD COMMAND.
#
# Build minutes are the metered resource on Netlify; deploys themselves are not
# individually billed. Everything this site serves — the data JSON, the single
# file bundle, the service worker's cache stamp — is generated by `npm run
# build` and committed to the repository, so Netlify has nothing to build and
# nothing to meter. A push updates the site by uploading only the files whose
# contents changed.
#
# Bandwidth stays small for the same reason photos do not appear in this repo:
# every photograph streams from Wikimedia Commons. We serve about 1.8 MB of
# HTML, CSS, JS and JSON on a first visit (much less gzipped), and the service
# worker caches it, so repeat visits cost almost nothing.

[build]
  publish = "."

[build.environment]
  # Nothing to install — the project has no dependencies at all.
  NETLIFY_USE_YARN = "false"

# --- caching ----------------------------------------------------------------
# Netlify already sends `max-age=0, must-revalidate` with an ETag by default,
# which is what this app wants: revalidation is a cheap 304 and nothing ever
# goes stale. These two are pinned explicitly because getting them wrong is
# unrecoverable from the user's side.

[[headers]]
  # A cached service worker can never be replaced by a newer one. Always
  # revalidate, or a deploy silently fails to reach anybody who has visited.
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  # The service worker is network-first for data, so the network copy must
  # actually be the current one.
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Photos come from Wikimedia; nothing else is fetched from anywhere.
    #
    # connect-src MUST include Wikimedia, not just img-src. The service worker
    # intercepts every cross-origin request and re-fetches it itself, and a
    # fetch made from inside a worker is governed by the CSP delivered with the
    # worker script — so `connect-src 'self'` silently forbade it and killed
    # every photograph on the deployed site while local development, which
    # sends no CSP at all, looked perfect.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://upload.wikimedia.org; connect-src 'self' https://upload.wikimedia.org; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

# Routing is entirely hash-based (#/setup, #/place/rivendell), so every URL is
# served by index.html as it stands. No SPA fallback is needed or wanted.
