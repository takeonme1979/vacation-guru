name: check

# Runs on GitHub's minutes, not Netlify's. Netlify never builds this project,
# so nothing here costs anything on that side of the fence.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # There are no dependencies to install. That is not an oversight.

      - name: Build data and bundle, strictly
        run: node tools/build-data.mjs --strict && node tools/bundle.mjs

      - name: Tests
        run: npm test

      # The whole deployment model rests on the committed artefacts being the
      # real ones. If someone edits a destination shard and forgets to rebuild,
      # Netlify would serve the stale data forever, because it never builds
      # anything itself. So: rebuild here and fail if anything differs.
      #
      # This is only possible because the build is reproducible — the cache
      # version and meta ids are content hashes, not timestamps — so identical
      # sources give byte-identical output on any machine.
      - name: Committed build output is up to date
        run: |
          if ! git diff --quiet; then
            echo "::error::Committed build output does not match the source data."
            echo "Run 'npm run build' and commit the result."
            git diff --stat
            exit 1
          fi
          echo "Rebuild reproduced the committed files exactly."
